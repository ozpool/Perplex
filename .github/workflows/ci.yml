name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge build
        run: cd contracts && forge build --sizes

      - name: forge fmt check
        run: cd contracts && forge fmt --check

      - name: forge test
        run: cd contracts && forge test -vvv

      - name: forge snapshot diff
        run: cd contracts && forge snapshot --diff || true

  rust:
    name: Cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

  devnet-smoke:
    name: devnet smoke
    runs-on: ubuntu-latest
    needs: [contracts, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
      - uses: dtolnay/rust-toolchain@stable
      # pnpm version is read from package.json packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install deps
        run: pnpm install --frozen-lockfile

      - name: dev-up
        run: make dev-up

      - name: smoke deposit / withdraw
        run: make dev-deposit

      - name: smoke trade (Phase 3 stub)
        run: make dev-trade

      - name: smoke liquidate (Phase 4 stub)
        run: make dev-liquidate

      - name: docker logs on failure
        if: failure()
        run: docker compose logs

      - name: dev-down
        if: always()
        run: make dev-down
