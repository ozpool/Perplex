name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge build
        run: cd contracts && forge build --sizes

      - name: forge fmt check
        run: cd contracts && forge fmt --check

      - name: forge test
        run: cd contracts && forge test -vvv

      - name: forge snapshot diff
        run: cd contracts && forge snapshot --diff || true

  rust:
    name: Cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

  devnet-smoke:
    name: devnet smoke (gated on Phase 1)
    runs-on: ubuntu-latest
    needs: [contracts, rust]
    # Smoke runs the full make dev-up which depends on Phase 1 Deploy.s.sol +
    # seed.ts package.json. Until those land, this job is informational only;
    # remove continue-on-error once Phase 1 is merged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install deps
        run: pnpm install --frozen-lockfile

      - name: dev-up
        run: make dev-up

      - name: dev-trade smoke
        run: make dev-trade

      - name: dev-liquidate smoke
        run: make dev-liquidate

      - name: dev-logs on failure
        if: failure()
        run: docker compose logs

      - name: dev-down
        if: always()
        run: make dev-down
