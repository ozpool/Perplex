[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["contracts/lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
# Block gas limit raised so the differential test can replay all fixtures in a single
# call; production deploys still observe Arbitrum's real block gas limit.
gas_limit = "18446744073709551615"
block_gas_limit = "10000000000"
# Deploy scripts write deployment manifests; tests read fixture JSON from
# contracts/test/differential.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./contracts/test/differential" },
]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1024, depth = 128 }
verbosity = 3

[rpc_endpoints]
anvil = "http://localhost:8545"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
arbitrum = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
